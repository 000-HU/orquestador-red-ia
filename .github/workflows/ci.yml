name: Enterprise CI Pipeline

on:
  push:
    branches: [ "desarrollo", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    steps:
    - name: 📂 Clonar repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📥 Instalar dependencias de análisis
      run: |
        python -m pip install --upgrade pip
        pip install pylint

    - name: 🛡️ Escaneo de Dependencias Vulnerables
      uses: actions/dependency-review-action@v4

    - name: 🔍 Análisis estático de código (Pylint)
      run: |
        # Analiza tus scripts corporativos asegurando el estándar de calidad
        pylint ia_ofensiva_escalada.py escaner_puertos.py --disable=C,R

