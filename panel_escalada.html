<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>ORQUESTADOR IA - CONTROL DE ESCALADA</title><style>body { background-color: #0d1117; color: #58a6ff; font-family: monospace; padding: 20px; }.panel { border: 2px solid #f85149; padding: 20px; border-radius: 5px; background-color: #161b22; }h1 { color: #f85149; text-shadow: 0 0 10px rgba(248,81,73,0.5); }button { background-color: #21262d; color: #f85149; border: 1px solid #f85149; padding: 10px 20px; cursor: pointer; font-weight: bold; }button:hover { background-color: #f85149; color: #ffffff; }.console { background-color: #010409; border: 1px solid #30363d; padding: 15px; margin-top: 15px; color: #7ee787; height: 150px; overflow-y: scroll; }</style></head><body><div class="panel"><h1>🛰️ PILA DE ESCALADA AGRESIVA v4.5</h1><p>Objetivo de purga activa: <strong>Servicio Nativo SSH (Persistencia Linux)</strong></p><button onclick="ejecutarPurgaNativa()">EJECUTAR COMANDO DE PURGA (FORZAR SYSTEM)</button><div class="console" id="logConsole">[SYS] Listo para inyección en la pila de red...</div></div><script>function ejecutarPurgaNativa(){const c=document.getElementById("logConsole");c.innerHTML+="<br>[*] Enviando payload al orquestador backend...";fetch("http://localhost:3001/api/purgar-nativa",{method:"POST"}).then(r=>r.json()).then(d=>{c.innerHTML+=\`<br>[+] Respuesta del Kernel: \${d.status}\`}).catch(e=>{c.innerHTML+="<br>[-] Falla en el puente del puerto 3001: "+e.message})}</script></body></html>
